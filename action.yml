name: Piston tunnel
description: >
  Opens a tunnel from the job to one of its organization's Piston network
  connectors, so it reaches the services the connector's routing rules grant
  it, by name or by address, and, with exit_node, sends its internet
  traffic out through the connector.
author: Piston
branding:
  icon: shield
  color: purple
inputs:
  connector_name:
    description: The network connector's name, as the Piston console shows it.
    required: true
  timeout:
    description: How many seconds the tunnel may take to come up, at most 290.
    required: false
    default: "30"
  exit_node:
    description: >
      Send all of the job's internet traffic out through the network
      connector, which must be an exit node.
    required: false
    default: "false"
  reset_connections:
    description: >
      Reset every TCP connection open on the machine once the tunnel is up, so
      none is left on a route the tunnel changed; false keeps them.
    required: false
    default: "true"
  tcp_buffer_max_mib:
    description: >
      The most each TCP connection on the machine may buffer each way, in MiB,
      1 to 1024. The step raises the machine's maximums to it, so a transfer
      through a connector far from Piston's runners can keep more in flight.
    required: false
    default: "32"
  audience:
    description: >
      The Piston api the job's token is for; set it only on a Piston other
      than production.
    required: false
    default: https://api.runners.eu.prod.piston.sh
outputs:
  matched_rules:
    description: >
      The names of the routing rules that admitted the job, comma separated.
runs:
  using: node24
  main: dist/index.js
